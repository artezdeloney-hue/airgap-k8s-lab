kind: ZarfPackageConfig
metadata:
  name: airgap-api
  version: 0.2.1
  description: Python API packaged for disconnected delivery
components:
  - name: airgap-api
    required: true
    charts:
      - name: airgap-api
        version: 0.1.0
        namespace: airgap-api
        localPath: charts/airgap-api
        valuesFiles:
          - charts/airgap-api/values-lab.yaml
    images:
      - airgap-api:0.1.0
